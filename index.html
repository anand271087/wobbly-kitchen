/* ============================================================
   WOBBLY KITCHEN
   Walk the chef:  ◀ ▶   Do the thing:  SPACE / the big button
   PREP → COOK → SERVE → CLEAN
   ============================================================ */
:root{
  --butter:#FFD766;
  --butter-deep:#F5BE3C;
  --tomato:#E8412F;
  --leaf:#5FB33F;
  --brown:#4A2C18;
  --wood:#B9793F;
  --wood-dark:#8E5A2B;
  --cream:#FFF6E3;
  --cream-deep:#FFE9C2;
  --line:5px;
  --pop:cubic-bezier(.34,1.7,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  background:var(--butter);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.45) 0 2px, transparent 3px),
    radial-gradient(circle at 62% 72%, rgba(255,255,255,.35) 0 2px, transparent 3px),
    radial-gradient(circle at 84% 28%, rgba(255,255,255,.35) 0 2px, transparent 3px);
  background-size:120px 120px,160px 160px,200px 200px;
  color:var(--brown);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.paper{background:var(--cream);border:var(--line) solid var(--brown);border-radius:22px;box-shadow:6px 7px 0 rgba(74,44,24,.28);}

/* ============================================================ LAYOUT */
#app{
  height:100dvh;height:100vh;
  display:grid;grid-template-rows:auto 1fr;
  gap:clamp(4px,.9dvh,11px);
  padding:clamp(4px,1dvh,12px);
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:clamp(3px,.6dvh,8px) clamp(9px,1.5vw,19px);
  background:var(--tomato);border:var(--line) solid var(--brown);border-radius:20px;
  box-shadow:5px 6px 0 rgba(74,44,24,.3);transform:rotate(-.5deg);
}
#title{
  font-size:clamp(16px,2.8dvh,32px);font-weight:700;color:var(--cream);
  text-shadow:3px 3px 0 rgba(74,44,24,.55);cursor:pointer;touch-action:none;white-space:nowrap;
}
#title.resetting{animation:titleShake .35s linear infinite;}
@keyframes titleShake{0%,100%{transform:rotate(-2deg) scale(1.02)}50%{transform:rotate(2deg) scale(1.06)}}

.hud{display:flex;align-items:center;gap:clamp(4px,.8vw,10px);}
.chip{
  min-width:64px;min-height:64px;padding:0 clamp(6px,1vw,13px);
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:clamp(14px,2.2dvh,22px);font-weight:700;
  background:var(--cream);border:var(--line) solid var(--brown);border-radius:18px;
  box-shadow:3px 4px 0 rgba(74,44,24,.35);cursor:pointer;transform:rotate(1deg);
  transition:transform .12s var(--pop);
}
.chip:active{transform:rotate(1deg) scale(.92);}
.chip.off{opacity:.55;}
.chip .ico{font-size:clamp(18px,2.6dvh,26px);line-height:1;}

/* the pantry must stay wide enough for 3 columns of 64px tap targets */
main{display:grid;grid-template-columns:clamp(228px,23vw,290px) 1fr;gap:clamp(6px,1.1vw,14px);min-height:0;}

/* ---------- pantry ---------- */
#pantry{display:flex;flex-direction:column;min-height:0;padding:clamp(4px,.8dvh,10px);transform:rotate(-.7deg);}
.panel-label{text-align:center;font-size:clamp(11px,1.8dvh,18px);font-weight:700;letter-spacing:.07em;margin-bottom:clamp(3px,.6dvh,8px);}
#shelf{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));
  gap:clamp(4px,1.2dvh,12px);align-content:space-evenly;padding:2px;scrollbar-width:thin;
}
#shelf::-webkit-scrollbar{width:9px;}
#shelf::-webkit-scrollbar-thumb{background:var(--butter-deep);border-radius:9px;border:2px solid var(--cream);}
.ingredient{
  position:relative;min-width:64px;min-height:64px;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(27px,3.9dvh,40px);
  background:var(--cream-deep);border:4px solid var(--brown);border-radius:18px;
  box-shadow:3px 4px 0 rgba(74,44,24,.3);cursor:grab;touch-action:none;
  filter:drop-shadow(2px 3px 1px rgba(74,44,24,.35));
  transition:transform .14s var(--pop),box-shadow .14s ease;
}
.ingredient:nth-child(3n){transform:rotate(2deg);}
.ingredient:nth-child(3n+1){transform:rotate(-2deg);}
.ingredient:nth-child(3n+2){transform:rotate(1deg);}
.ingredient.grabbed{opacity:.35;transform:scale(.9);}
.ingredient.pressed{transform:scale(1.18) rotate(-4deg);box-shadow:5px 7px 0 rgba(74,44,24,.35);}
.ingredient .badge{
  position:absolute;top:-8px;right:-8px;
  width:clamp(22px,2.9dvh,28px);height:clamp(22px,2.9dvh,28px);
  display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.5dvh,15px);
  background:var(--butter);border:3px solid var(--brown);border-radius:50%;
  box-shadow:1px 2px 0 rgba(74,44,24,.35);filter:none;
}

/* ============================================================ KITCHEN */
#kitchen{display:grid;grid-template-rows:auto auto auto;align-content:center;gap:0;min-height:0;}

/* the counter top — the four stations stand on it, left to right, in cooking order */
#counter{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:clamp(4px,.8vw,12px);min-height:0;
  padding:clamp(5px,1dvh,13px) clamp(4px,.8vw,11px) 0;
  background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.52) 60%,var(--cream-deep) 100%);
  border:var(--line) solid var(--brown);
  border-bottom:9px solid var(--brown);
  border-radius:22px 22px 0 0;
}
.station{
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  gap:clamp(2px,.5dvh,7px);min-height:0;
}
/* the numbered step label above each station */
.steptag{
  display:flex;align-items:center;gap:5px;
  font-size:clamp(9px,1.5dvh,15px);font-weight:700;letter-spacing:.07em;
  padding:3px clamp(5px,.8vw,11px);
  background:rgba(74,44,24,.12);
  border:3px solid rgba(74,44,24,.26);
  border-radius:12px;color:rgba(74,44,24,.55);
  white-space:nowrap;transition:all .25s var(--pop);
}
.steptag b{
  display:flex;align-items:center;justify-content:center;
  width:1.55em;height:1.55em;border-radius:50%;
  background:rgba(74,44,24,.24);color:var(--cream);font-size:.95em;
}
.steptag.now{
  background:var(--tomato);border-color:var(--brown);color:var(--cream);
  transform:scale(1.1) rotate(-2deg);box-shadow:2px 3px 0 rgba(74,44,24,.35);
}
.steptag.now b{background:var(--cream);color:var(--tomato);}
/* only the working area lights up when the chef is standing here */
.stationBody{
  position:relative;display:flex;flex-direction:column;align-items:center;
  gap:clamp(2px,.5dvh,7px);width:100%;
  padding:clamp(4px,.8dvh,10px) 2px clamp(2px,.5dvh,6px);
  border-radius:18px;
  transition:background .2s ease,box-shadow .2s ease,transform .2s var(--pop);
}
.station.here .stationBody{
  background:rgba(255,255,255,.8);
  box-shadow:inset 0 0 0 4px rgba(74,44,24,.32);
  transform:scale(1.04);
}
.chipword{
  display:flex;align-items:center;gap:clamp(4px,.7vw,9px);
  font-size:clamp(9px,1.6dvh,17px);font-weight:700;letter-spacing:.05em;
  padding:3px clamp(6px,.9vw,12px);
  background:var(--cream);border:4px solid var(--brown);border-radius:13px;
  box-shadow:3px 3px 0 rgba(74,44,24,.3);white-space:nowrap;transform:rotate(-2deg);
  transition:opacity .2s ease,background .2s ease;
}
.chipword.dim{opacity:.4;}
.chipword.go{background:var(--leaf);color:var(--cream);text-shadow:1px 1px 0 rgba(74,44,24,.5);}

/* ---------- prep board ---------- */
#board{
  position:relative;width:clamp(112px,96%,220px);height:clamp(90px,17.5dvh,166px);
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 3px,transparent 3px 24px),
    linear-gradient(170deg,var(--wood) 0%,var(--wood-dark) 100%);
  border:var(--line) solid var(--brown);border-radius:14px 14px 18px 18px;
  box-shadow:5px 7px 0 rgba(74,44,24,.3);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:pointer;overflow:hidden;transform:rotate(-1deg);
}
#board.drop-ok{box-shadow:0 0 0 7px var(--leaf),5px 7px 0 rgba(74,44,24,.3);}
#boardKnife{position:absolute;right:5px;bottom:1px;font-size:clamp(16px,2.4dvh,26px);opacity:.7;pointer-events:none;transform:rotate(18deg);}
.slash{position:absolute;top:-12%;left:50%;width:7px;height:124%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));border-radius:6px;pointer-events:none;}
#squeezeRing{
  position:absolute;width:clamp(46px,7dvh,64px);height:clamp(46px,7dvh,64px);border-radius:50%;
  background:conic-gradient(var(--leaf) calc(var(--fill,0)*360deg),rgba(255,255,255,.25) 0);
  border:4px solid var(--brown);display:none;pointer-events:none;
}
#squeezeRing.show{display:block;}

/* ---------- pan ---------- */
#pan{
  position:relative;width:clamp(120px,25dvh,214px);height:clamp(120px,25dvh,214px);border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#6b5140 0%,#3d2718 78%);
  border:var(--line) solid var(--brown);
  box-shadow:6px 8px 0 rgba(74,44,24,.32),inset 0 -10px 22px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;
}
#pan::after{content:"";position:absolute;right:-22%;top:50%;width:24%;height:16%;transform:translateY(-50%) rotate(-8deg);background:var(--brown);border-radius:9px;box-shadow:4px 5px 0 rgba(74,44,24,.3);}
#pan.hot{animation:sizzleShake .16s linear infinite;}
@keyframes sizzleShake{0%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}50%{transform:translate(1px,-1.5px)}75%{transform:translate(1.5px,1px)}100%{transform:translate(0,0)}}
#pan.drop-ok{box-shadow:0 0 0 7px var(--leaf),6px 8px 0 rgba(74,44,24,.32);}
#pan.tip{animation:tipPan .45s var(--pop);}
@keyframes tipPan{0%{transform:rotate(0)}45%{transform:rotate(26deg) translateY(9px)}100%{transform:rotate(0)}}
#grime{
  position:absolute;inset:6%;border-radius:50%;display:none;pointer-events:none;
  background:
    radial-gradient(circle at 30% 40%,rgba(120,95,60,.85) 0 13%,transparent 14%),
    radial-gradient(circle at 66% 33%,rgba(105,80,50,.8) 0 10%,transparent 11%),
    radial-gradient(circle at 52% 70%,rgba(130,100,65,.8) 0 15%,transparent 16%),
    radial-gradient(circle at 25% 68%,rgba(110,88,55,.75) 0 9%,transparent 10%);
}
#grime.show{display:block;}
#sponge{position:absolute;font-size:clamp(24px,4dvh,42px);display:none;pointer-events:none;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.4));animation:spongeNudge 1s ease-in-out infinite;}
#sponge.show{display:block;}
@keyframes spongeNudge{0%,100%{transform:translateX(-14px) rotate(-8deg)}50%{transform:translateX(14px) rotate(8deg)}}
.sud{position:fixed;z-index:56;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.9);}
.flame{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);font-size:clamp(18px,3dvh,32px);filter:drop-shadow(0 0 10px rgba(232,65,47,.8));animation:flicker .4s ease-in-out infinite alternate;pointer-events:none;}
@keyframes flicker{from{transform:translateX(-50%) scale(.9) rotate(-4deg);opacity:.85}to{transform:translateX(-50%) scale(1.12) rotate(4deg);opacity:1}}
#heat{display:flex;align-items:flex-end;gap:3px;height:clamp(12px,1.8dvh,19px);}
#heat .bar{width:clamp(5px,.8vw,9px);height:30%;background:var(--cream-deep);border:2px solid var(--brown);border-radius:4px;transition:background .3s ease,height .3s var(--pop);}
#heat .bar.on{background:var(--tomato);}
#heat .bar.max{background:#2a1a10;}

/* ---------- food ---------- */
.contents{position:absolute;inset:14%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
#boardContents{gap:clamp(3px,.7vw,9px);}
#boardContents .food{position:relative;font-size:clamp(17px,3.1dvh,35px);}
.food{position:absolute;font-size:clamp(22px,3.9dvh,44px);filter:drop-shadow(2px 3px 2px rgba(0,0,0,.45));transition:filter .5s ease;animation:foodWobble 1.4s ease-in-out infinite;}
@keyframes foodWobble{
  0%,100%{transform:translate(var(--ox,0px),var(--oy,0px)) rotate(var(--rot,0deg)) scale(1)}
  50%{transform:translate(var(--ox,0px),var(--oy,0px)) rotate(calc(var(--rot,0deg) + 6deg)) scale(1.07)}
}
.food.s0{filter:drop-shadow(2px 3px 2px rgba(0,0,0,.4));}
.food.s1{filter:saturate(1.25) drop-shadow(2px 3px 2px rgba(0,0,0,.4));}
.food.s2{filter:sepia(.3) saturate(1.45) drop-shadow(2px 3px 2px rgba(0,0,0,.4));}
.food.s3{filter:sepia(.6) saturate(1.7) brightness(.92) drop-shadow(0 0 8px rgba(255,190,60,.8));}
.food.s4{filter:grayscale(1) brightness(.22) contrast(1.5) drop-shadow(2px 3px 2px rgba(0,0,0,.5));}
.food.pile{display:flex;gap:.04em;align-items:center;}
.food.pile span{font-size:.44em;display:block;}
.food.pile span:nth-child(1){transform:rotate(-16deg) translateY(3px);}
.food.pile span:nth-child(2){transform:rotate(6deg) translateY(-3px);}
.food.pile span:nth-child(3){transform:rotate(20deg) translateY(2px);}

/* ---------- plate ---------- */
#plate{
  position:relative;width:clamp(112px,96%,220px);height:clamp(90px,16.5dvh,158px);border-radius:50%;
  background:radial-gradient(circle at 40% 34%,#fff 0%,var(--cream) 55%,var(--cream-deep) 100%);
  border:var(--line) solid var(--brown);
  box-shadow:6px 8px 0 rgba(74,44,24,.28),inset 0 -6px 14px rgba(74,44,24,.12);
  display:flex;align-items:center;justify-content:center;touch-action:none;
}
#plate.drop-ok{box-shadow:0 0 0 7px var(--leaf),6px 8px 0 rgba(74,44,24,.28);}
#plate.nice{box-shadow:0 0 0 6px rgba(95,179,63,.55),6px 8px 0 rgba(74,44,24,.28),inset 0 -6px 14px rgba(74,44,24,.12);}
#plate.pop{animation:platePop .4s var(--pop);}
.food.garnish{animation:none;font-size:clamp(15px,2.6dvh,30px);}
@keyframes platePop{0%{transform:scale(1)}40%{transform:scale(1.1) rotate(-2deg)}100%{transform:scale(1)}}
.hint{position:absolute;font-size:clamp(9px,1.5dvh,15px);font-weight:600;letter-spacing:.05em;line-height:1.2;color:rgba(74,44,24,.42);pointer-events:none;text-align:center;transition:opacity .3s ease;}

/* ---------- the customer ---------- */
#seat{
  position:relative;width:clamp(112px,96%,220px);height:clamp(90px,16.5dvh,158px);
  display:flex;align-items:flex-end;justify-content:center;
  border-bottom:6px dashed rgba(74,44,24,.3);
}
#customer{
  font-size:clamp(48px,9.6dvh,104px);
  filter:drop-shadow(4px 6px 3px rgba(74,44,24,.4));
  cursor:pointer;touch-action:none;
  animation:custIdle 3.4s ease-in-out infinite;
}
@keyframes custIdle{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.035)}}
#customer.arrive{animation:custArrive .6s var(--pop);}
@keyframes custArrive{from{transform:translateX(120px) scale(.4);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
#customer.leave{animation:custLeave .6s ease-in forwards;}
@keyframes custLeave{to{transform:translateX(130px) scale(.4);opacity:0}}
#customer.chew{animation:chew .26s ease-in-out infinite;}
@keyframes chew{0%,100%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(1.14,.86) rotate(3deg)}}
#customer.happy{animation:hop .45s var(--pop) 2;}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.1,.92)}}

#bubble{
  position:relative;max-width:100%;
  font-size:clamp(9px,1.55dvh,16px);font-weight:700;letter-spacing:.04em;
  text-align:center;line-height:1.15;
  padding:5px clamp(7px,1.1vw,13px);
  background:var(--cream);border:4px solid var(--brown);border-radius:15px;
  box-shadow:3px 4px 0 rgba(74,44,24,.3);transform:rotate(-2deg);
  opacity:0;transition:opacity .25s ease;
}
#bubble.show{opacity:1;animation:bubbleIn .4s var(--pop);}
@keyframes bubbleIn{from{transform:rotate(-2deg) scale(.4)}to{transform:rotate(-2deg) scale(1)}}
#bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:0;height:0;margin-left:-8px;border:8px solid transparent;border-top-color:var(--brown);}
#stars{font-size:clamp(11px,1.9dvh,20px);letter-spacing:2px;height:1.3em;opacity:0;transition:opacity .2s ease;}
#stars.show{opacity:1;animation:bubbleIn .4s var(--pop);}

/* ---------- the floor the chef walks on ---------- */
#floor{
  position:relative;
  height:clamp(92px,15dvh,150px);
  border:var(--line) solid var(--brown);
  border-top:none;
  border-radius:0 0 20px 20px;
  background:linear-gradient(180deg,rgba(74,44,24,.17),rgba(74,44,24,.03));
}
#chef{
  position:absolute;bottom:2px;left:0;
  font-size:clamp(46px,9.2dvh,100px);
  filter:drop-shadow(4px 6px 3px rgba(74,44,24,.45));
  transform:translateX(-50%);
  transition:left .3s cubic-bezier(.3,1.4,.5,1);
  will-change:left;pointer-events:none;
}
#chefBody{display:block;animation:chefIdle 2.2s ease-in-out infinite;}
@keyframes chefIdle{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
#chef.walk #chefBody{animation:chefWalk .3s ease-in-out infinite;}
@keyframes chefWalk{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
#chef.flip{transform:translateX(-50%) scaleX(-1);}
/* what the chef is carrying, floating over his head */
#hands{
  position:absolute;left:50%;top:-6px;
  transform:translate(-50%,-100%);
  font-size:clamp(19px,3.2dvh,36px);
  filter:drop-shadow(2px 3px 2px rgba(0,0,0,.4));
  display:none;animation:handsBob 1.1s ease-in-out infinite;
}
#hands.show{display:flex;gap:.1em;align-items:center;}
#hands .hitem{display:block;}
#hands .hitem.pile{display:flex;gap:.03em;}
#hands .hitem.pile span{font-size:.44em;}
@keyframes handsBob{0%,100%{transform:translate(-50%,-100%) translateY(0) rotate(-5deg)}50%{transform:translate(-50%,-100%) translateY(-6px) rotate(5deg)}}
#chef.flip #hands{transform:translate(-50%,-100%) scaleX(-1);}

/* ---------- controls ---------- */
#controls{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.4vw,20px);padding-bottom:2px;margin-top:clamp(4px,.9dvh,12px);}
.ctrl{
  min-width:clamp(64px,8dvh,80px);min-height:clamp(64px,8dvh,80px);
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-size:clamp(24px,3.6dvh,38px);font-weight:700;
  background:var(--cream);color:var(--brown);
  border:var(--line) solid var(--brown);border-radius:20px;
  box-shadow:5px 6px 0 rgba(74,44,24,.35);
  cursor:pointer;touch-action:none;transition:transform .12s var(--pop),box-shadow .12s ease;
}
.ctrl:active,.ctrl.down{transform:scale(.92) translate(2px,3px);box-shadow:2px 3px 0 rgba(74,44,24,.35);}
#doIt{
  min-width:clamp(150px,26vw,300px);
  padding:0 clamp(10px,2vw,26px);
  font-size:clamp(16px,2.7dvh,32px);letter-spacing:.05em;
  background:var(--leaf);color:var(--cream);
  text-shadow:2px 2px 0 rgba(74,44,24,.45);
  transform:rotate(-1.2deg);
}
#doIt:active,#doIt.down{transform:rotate(-1.2deg) scale(.93) translate(2px,3px);}
#doIt.idle{background:var(--cream-deep);color:rgba(74,44,24,.55);text-shadow:none;}
#doIt.serve{background:var(--tomato);animation:breathe 1.5s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:rotate(-1.2deg) scale(1)}50%{transform:rotate(-1.2deg) scale(1.05)}}
#trash{font-size:clamp(22px,3.4dvh,36px);transform:rotate(2deg);}
#trash.drop-ok{box-shadow:0 0 0 7px var(--tomato),5px 6px 0 rgba(74,44,24,.35);}

/* ============================================================ OVERLAYS */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:95;}
.flyer,.ghost{position:fixed;z-index:80;pointer-events:none;font-size:clamp(28px,4.4dvh,48px);filter:drop-shadow(3px 5px 3px rgba(74,44,24,.5));will-change:transform;}
.ghost{transform:translate(-50%,-50%) scale(1.25) rotate(-6deg);}
.flyer.pile{display:flex;gap:.04em;}
.flyer.pile span{font-size:.44em;}
.steam{position:fixed;z-index:55;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.75);will-change:transform,opacity;}
.conf{position:absolute;width:14px;height:20px;border-radius:3px;will-change:transform,opacity;}

#banner{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:clamp(5px,1.2dvh,14px);pointer-events:none;padding:18px;}
#banner.show{display:flex;animation:scrimIn .3s ease both;}
@keyframes scrimIn{from{background:rgba(255,215,102,0)}to{background:rgba(255,215,102,.42)}}
#bannerDish{font-size:clamp(40px,10dvh,110px);filter:drop-shadow(4px 6px 4px rgba(74,44,24,.45));animation:dishIn .5s var(--pop) both;}
#bannerName{
  font-weight:700;text-align:center;line-height:1.02;color:var(--cream);background:var(--tomato);
  border:6px solid var(--brown);border-radius:24px;
  padding:clamp(4px,1.1dvh,15px) clamp(13px,2.6vw,38px);
  box-shadow:8px 10px 0 rgba(74,44,24,.4);text-shadow:4px 4px 0 rgba(74,44,24,.5);
  transform:rotate(-2deg);animation:nameIn .55s var(--pop) both;max-width:92vw;
}
#bannerNew{
  font-size:clamp(17px,3dvh,34px);font-weight:700;letter-spacing:.08em;color:var(--brown);background:var(--butter);
  border:5px solid var(--brown);border-radius:18px;padding:5px clamp(12px,2vw,26px);
  box-shadow:5px 6px 0 rgba(74,44,24,.35);transform:rotate(2.5deg);
  animation:nameIn .55s .12s var(--pop) both;display:none;
}
#bannerNew.show{display:block;}
@keyframes dishIn{from{transform:scale(.2) rotate(-24deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes nameIn{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}

/* ---------- recipe book ---------- */
#bookModal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(74,44,24,.55);padding:clamp(8px,2dvh,26px);}
#bookModal.show{display:flex;animation:fadeIn .2s ease both;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#bookPanel{width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;padding:clamp(8px,1.6dvh,18px);transform:rotate(-.4deg);animation:bookIn .38s var(--pop) both;}
@keyframes bookIn{from{transform:scale(.75) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-.4deg);opacity:1}}
#bookTop{display:flex;align-items:center;gap:clamp(6px,1.4vw,16px);margin-bottom:clamp(5px,1dvh,12px);}
#bookTitle{font-size:clamp(18px,3dvh,32px);font-weight:700;color:var(--cream);background:var(--tomato);border:4px solid var(--brown);border-radius:15px;padding:3px clamp(9px,1.5vw,19px);text-shadow:2px 2px 0 rgba(74,44,24,.5);transform:rotate(-1.5deg);}
#bookScore{font-size:clamp(12px,2dvh,21px);font-weight:700;background:var(--butter);border:4px solid var(--brown);border-radius:14px;padding:3px clamp(7px,1.1vw,14px);transform:rotate(1.5deg);white-space:nowrap;}
#bookClose{margin-left:auto;min-width:64px;min-height:64px;font-family:inherit;font-size:clamp(21px,3.2dvh,30px);font-weight:700;color:var(--cream);background:var(--brown);border:4px solid var(--brown);border-radius:18px;box-shadow:3px 4px 0 rgba(74,44,24,.35);cursor:pointer;transition:transform .14s var(--pop);}
#bookClose:active{transform:scale(.9);}
#bookScroll{overflow-y:auto;min-height:0;padding:2px 4px 6px;}
.bookHead{font-size:clamp(11px,1.8dvh,17px);font-weight:700;letter-spacing:.1em;color:rgba(74,44,24,.6);margin:clamp(6px,1.2dvh,14px) 0 clamp(3px,.6dvh,8px);}
.bookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(82px,10.5vw,126px),1fr));gap:clamp(5px,1vh,11px);}
.card{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;text-align:center;background:var(--cream-deep);border:4px solid var(--brown);border-radius:16px;box-shadow:2px 3px 0 rgba(74,44,24,.28);}
.card:nth-child(2n){transform:rotate(1.2deg);}
.card:nth-child(2n+1){transform:rotate(-1.2deg);}
.card .cE{font-size:clamp(22px,3.4dvh,36px);line-height:1.1;}
.card .cN{font-size:clamp(8px,1.3dvh,12px);font-weight:700;line-height:1.1;}
.card.locked{background:rgba(74,44,24,.09);border-style:dashed;}
.card.locked .cE{opacity:.4;}
.card.locked .cN{color:rgba(74,44,24,.5);}
.card.mine{background:var(--butter);}

@media (prefers-reduced-motion:reduce){*,*::after,*::before{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}}
</style>
</head>
<body>

<div id="app">

  <header>
    <div id="title">WOBBLY KITCHEN</div>
    <div class="hud">
      <div class="chip" id="bookChip"><span class="ico">📖</span><span id="bookCount">0</span></div>
      <div class="chip" id="soundChip"><span class="ico" id="soundIco">🔊</span></div>
    </div>
  </header>

  <main>

    <section id="pantry" class="paper">
      <div class="panel-label">PANTRY</div>
      <div id="shelf"></div>
    </section>

    <section id="kitchen">

      <div id="counter">

        <!-- 0. the board -->
        <div class="station" id="boardStation" data-spot="0">
          <div class="steptag" data-step="prep"><b>1</b>PREP</div>
          <div class="stationBody">
            <div class="chipword dim" id="boardWord">PUT FOOD HERE</div>
            <div id="board" data-drop="board">
              <div class="contents" id="boardContents"></div>
              <div id="squeezeRing"></div>
              <div id="boardKnife">🔪</div>
            </div>
          </div>
        </div>

        <!-- 1. the pan -->
        <div class="station" id="panStation" data-spot="1">
          <div class="steptag" data-step="cook"><b>2</b><span id="panTagText">COOK</span></div>
          <div class="stationBody">
            <div class="chipword dim" id="panWord">
              <div id="heat"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
              <span id="panWordText">EMPTY</span>
            </div>
            <div id="pan" data-drop="pan">
              <div class="flame">🔥</div>
              <div class="contents" id="panContents"></div>
              <div id="grime"></div>
              <div id="sponge">🧽</div>
            </div>
          </div>
        </div>

        <!-- 2. the plate -->
        <div class="station" id="plateStation" data-spot="2">
          <div class="steptag" data-step="serve"><b>3</b>PLATE</div>
          <div class="stationBody">
            <div class="chipword dim" id="plateWord">PLATE</div>
            <div id="plate" data-drop="plate">
              <div class="contents" id="plateContents"></div>
              <div class="hint" id="plateHint">EMPTY</div>
            </div>
          </div>
        </div>

        <!-- 3. the customer -->
        <div class="station" id="seatStation" data-spot="3">
          <div class="steptag" data-step="serve"><b>4</b>SERVE</div>
          <div class="stationBody">
            <div id="bubble">HELLO CHEF!</div>
            <div id="stars"></div>
            <div id="seat" data-drop="seat">
              <div id="customer">🐻</div>
            </div>
          </div>
        </div>

      </div>

      <div id="floor">
        <div id="chef">
          <span id="chefBody">🧑‍🍳</span>
          <span id="hands"></span>
        </div>
      </div>

      <div id="controls">
        <button class="ctrl" id="goLeft" aria-label="left">◀</button>
        <button class="ctrl" id="doIt">PICK FOOD</button>
        <button class="ctrl" id="goRight" aria-label="right">▶</button>
        <button class="ctrl" id="trash" data-drop="trash" aria-label="bin">🗑️</button>
      </div>

    </section>

  </main>
</div>

<div id="fx"></div>

<div id="banner">
  <div id="bannerDish">🍽️</div>
  <div id="bannerName">YUM</div>
  <div id="bannerNew">NEW RECIPE!</div>
</div>

<div id="bookModal">
  <div id="bookPanel" class="paper">
    <div id="bookTop">
      <div id="bookTitle">RECIPE BOOK</div>
      <div id="bookScore">0 OF 21</div>
      <button id="bookClose">✕</button>
    </div>
    <div id="bookScroll">
      <div class="bookHead">ALL RECIPES</div>
      <div class="bookGrid" id="bookGrid"></div>
      <div class="bookHead" id="ownHead" style="display:none">YOUR OWN</div>
      <div class="bookGrid" id="ownGrid"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   GAME DATA — a parent can edit everything in this block
   ============================================================ */

const INGREDIENTS = [
  { id:"tomato",   emoji:"🍅", name:"Tomato"   },
  { id:"carrot",   emoji:"🥕", name:"Carrot"   },
  { id:"potato",   emoji:"🥔", name:"Potato"   },
  { id:"egg",      emoji:"🥚", name:"Egg"      },
  { id:"cheese",   emoji:"🧀", name:"Cheese"   },
  { id:"bread",    emoji:"🍞", name:"Bread"    },
  { id:"chicken",  emoji:"🍗", name:"Chicken"  },
  { id:"fish",     emoji:"🐟", name:"Fish"     },
  { id:"mushroom", emoji:"🍄", name:"Mushroom" },
  { id:"onion",    emoji:"🧅", name:"Onion"    },
  { id:"corn",     emoji:"🌽", name:"Corn"     },
  { id:"lemon",    emoji:"🍋", name:"Lemon"    }
];

/* which ingredients need a prep step, and which gesture */
const PREP = {
  potato:{kind:"cut",need:3}, carrot:{kind:"cut",need:3}, onion:{kind:"cut",need:3},
  tomato:{kind:"cut",need:3}, mushroom:{kind:"cut",need:3},
  egg:{kind:"crack",need:2},
  lemon:{kind:"squeeze",need:1}
};
const PREP_INFO = {
  cut:     { suffix:"|cut",   badge:"🔪", word:"CUT IT!",         btn:"CHOP!",   adj:"Chopped" },
  crack:   { suffix:"|crack", badge:"👊", word:"TAP TO CRACK",    btn:"CRACK!",  adj:"Cracked" },
  squeeze: { suffix:"|juice", badge:"🤏", word:"HOLD TO SQUEEZE", btn:"SQUEEZE", adj:"Juicy"   }
};
const PREPPED_LOOK = { "|cut":{pile:true}, "|crack":{emoji:"🟡"}, "|juice":{emoji:"💧"} };

/* "|cut" / "|crack" / "|juice" mean the prepped version is needed.
   Ingredient order never matters. */
const RECIPES = [
  { need:["bread","cheese"],                       name:"Grilled Cheese",  emoji:"🧀" },
  { need:["bread","cheese","tomato|cut"],          name:"Pizza",           emoji:"🍕" },
  { need:["egg|crack","cheese"],                   name:"Cheesy Omelette", emoji:"🍳" },
  { need:["egg|crack","bread"],                    name:"French Toast",    emoji:"🥞" },
  { need:["potato|cut","onion|cut"],               name:"Hash Browns",     emoji:"🥔" },
  { need:["tomato|cut","onion|cut","carrot|cut"],  name:"Soup",            emoji:"🍲" },
  { need:["chicken","lemon|juice"],                name:"Lemon Chicken",   emoji:"🍗" },
  { need:["fish","lemon|juice"],                   name:"Fish Dinner",     emoji:"🐟" },
  { need:["carrot|cut","potato|cut","onion|cut"],  name:"Stew",            emoji:"🍛" },
  { need:["corn","cheese"],                        name:"Corn Cheese",     emoji:"🌽" },
  { need:["mushroom|cut","onion|cut","cheese"],    name:"Mushroom Melt",   emoji:"🍄" },
  { need:["bread","chicken","cheese"],             name:"Big Sandwich",    emoji:"🥪" },
  { need:["potato|cut"],                           name:"Fries",           emoji:"🍟" },
  { need:["potato|cut","cheese"],                  name:"Cheesy Fries",    emoji:"🧀" },
  { need:["carrot|cut"],                           name:"Carrot Sticks",   emoji:"🥕" },
  { need:["tomato|cut","onion|cut"],               name:"Salsa",           emoji:"🥣" },
  { need:["tomato|cut","bread"],                   name:"Tomato Toast",    emoji:"🍞" },
  { need:["potato|cut","egg|crack"],               name:"Potato Cakes",    emoji:"🥞" },
  { need:["mushroom|cut","egg|crack"],             name:"Egg Scramble",    emoji:"🍳" },
  { need:["carrot|cut","potato|cut","tomato|cut"], name:"Veggie Bake",     emoji:"🥘" },
  { need:["onion|cut","bread","cheese"],           name:"Onion Toast",     emoji:"🧅" }
];

const SILLY_TEMPLATES = ["{A} Surprise","Wobbly {A} {B}","{A}-{B} Mash","Mystery Goo","Chef's Special {A}","Super {A} Stack"];
const MYSTERY_EMOJI = ["🥘","🍜","🥣","🫕","🍥","🥗","🫙"];

/* the customers who come to eat */
const CUSTOMERS = ["🐻","🐼","🐵","🐰","🦊","🐯","🐷","🐨","🐸","🐮"];
const HELLOS = ["HELLO CHEF!","I AM HUNGRY","WHAT IS COOKING?","FEED ME PLEASE","SMELLS GOOD!"];

/* what they say after eating. never mean, always four words or fewer. */
const VERDICTS = {
  great: { stars:2, faces:["😍","🤩","😋"], lines:["SO YUMMY!","BEST DINNER EVER","PERFECT! THANK YOU","I LOVE IT!"] },
  okay:  { stars:2, faces:["😊","🙂","😯"], lines:["OKAY! THANK YOU","NOT BAD!","FUNNY BUT NICE","IT IS OKAY"] },
  cold:  { stars:1, faces:["🥶","😅"],      lines:["A BIT COLD","COOK IT NEXT TIME","CRUNCHY AND RAW!"] },
  crispy:{ stars:1, faces:["😵","🥴","😂"], lines:["TOO CRISPY! HA","A BIT BURNT","OOPS! STILL FUN"] }
};
/* one extra star for a plate that was made to look nice */
const PRETTY_LINES = ["SO PRETTY! YUMMY!","IT LOOKS LOVELY","PRETTY AND TASTY!"];
const PRETTY_HINT  = ["MAKE IT PRETTY!","TRY THE FANCY PLATE"];
const LIKES = {
  cheese:  ["MORE CHEESE PLEASE","CHEESY! YES!"],
  fish:    ["FISHY! SO GOOD"],
  lemon:   ["ZINGY! WOW!"],
  chicken: ["YUMMY CHICKEN!"]
};

const STATE_MS   = 4000;  // time per cooking stage
const MAX_HANDS  = 3;     // how much the chef can carry at once
const MAX_BOARD  = 3;     // how many things fit on the board
const MAX_PAN    = 3;
const MAX_PLATE = 5;
const SCRUBS    = 3;     // presses to wash the pan
const SWIPE_PX  = 85;    // pointer travel that counts as one cut / scrub
const SAVE_KEY  = "wobblyKitchen";

/* ============================================================ SETUP */

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const byId = INGREDIENTS.reduce((m,i)=>(m[i.id]=i,m),{});

const SUFFIXES = ["|cut","|crack","|juice"];
const suffixOf = id => SUFFIXES.find(s=>id.endsWith(s)) || "";
const baseOf   = id => { const s=suffixOf(id); return s ? id.slice(0,-s.length) : id; };
const isPile   = id => !!(PREPPED_LOOK[suffixOf(id)]||{}).pile;
const emojiOf  = id => { const l=PREPPED_LOOK[suffixOf(id)]; return (l&&l.emoji) ? l.emoji : byId[baseOf(id)].emoji; };
const nameOf   = id => {
  const s = suffixOf(id);
  if(!s) return byId[id].name;
  const kind = Object.keys(PREP_INFO).find(k=>PREP_INFO[k].suffix === s);
  return PREP_INFO[kind].adj + " " + byId[baseOf(id)].name;
};

const keyOf = ids => [...new Set(ids)].sort().join("+");
const RECIPE_MAP = RECIPES.reduce((m,r)=>(m[keyOf(r.need)]=r,m),{});
const TOTAL_RECIPES = RECIPES.length;
const pick = a => a[Math.floor(Math.random()*a.length)];

const $ = s => document.querySelector(s);
const shelf=$("#shelf"),
      board=$("#board"), boardWord=$("#boardWord"), boardContents=$("#boardContents"), squeezeRing=$("#squeezeRing"),
      pan=$("#pan"), panContents=$("#panContents"), panWord=$("#panWord"), panWordText=$("#panWordText"),
      grime=$("#grime"), sponge=$("#sponge"), heatBars=[...document.querySelectorAll("#heat .bar")],
      plate=$("#plate"), plateContents=$("#plateContents"), plateHint=$("#plateHint"), plateWord=$("#plateWord"),
      seat=$("#seat"), customer=$("#customer"), bubble=$("#bubble"), stars=$("#stars"),
      chef=$("#chef"), hands=$("#hands"), floorEl=$("#floor"),
      goLeft=$("#goLeft"), goRight=$("#goRight"), doIt=$("#doIt"), trash=$("#trash"),
      fx=$("#fx"), banner=$("#banner"), bannerDish=$("#bannerDish"), bannerName=$("#bannerName"), bannerNew=$("#bannerNew"),
      bookModal=$("#bookModal"), bookGrid=$("#bookGrid"), ownGrid=$("#ownGrid"), ownHead=$("#ownHead"),
      bookScore=$("#bookScore"), bookCount=$("#bookCount"),
      soundChip=$("#soundChip"), soundIco=$("#soundIco"), title=$("#title"),
      stepEls=[...document.querySelectorAll(".steptag")], panTagText=$("#panTagText"),
      stationEls=[...document.querySelectorAll(".station")];

let uid = 0;
const state = {
  spot:   0,      // which station the chef is standing at (0..3)
  holding:[],     // what he is carrying (up to MAX_HANDS ids)
  board:  [],     // what is on the board (up to MAX_BOARD)
  decorated:false,// has the plate been made to look nice
  pan:    [],     // {uid,id,ms}
  plate:  [],     // {uid,id,stage}
  dirty:  false,
  scrubs: 0,
  panUsed:false,
  customer:CUSTOMERS[0],
  eating: false,
  busy:   false,
  paused: false
};

let save = { book:{}, muted:false };
try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const p=JSON.parse(raw); if(p&&typeof p==="object") save=Object.assign(save,p); } }catch(e){}
if(!save.book || typeof save.book!=="object") save.book = {};
const persist = ()=>{ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} };

/* ============================================================ SOUND */

const Sound = (()=>{
  let ctx=null, sizzleGain=null, ready=false;
  function noiseBuffer(sec){
    const n=Math.floor(ctx.sampleRate*sec), buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    return buf;
  }
  function init(){
    if(ctx){ if(ctx.state==="suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    const src=ctx.createBufferSource(); src.buffer=noiseBuffer(2); src.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=3200; bp.Q.value=.7;
    const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1400;
    sizzleGain=ctx.createGain(); sizzleGain.gain.value=0;
    src.connect(bp).connect(hp).connect(sizzleGain).connect(ctx.destination);
    src.start(); ready=true;
  }
  const on = ()=> ready && ctx && !save.muted;
  function blip(freq,dur,type,vol,slideTo,delay){
    if(!on()) return;
    const t0=ctx.currentTime+(delay||0), o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||.25,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+dur+.05);
  }
  function burst(dur,freq,vol,delay,type,q){
    if(!on()) return;
    const t0=ctx.currentTime+(delay||0), s=ctx.createBufferSource();
    s.buffer=noiseBuffer(Math.max(dur,.05));
    const f=ctx.createBiquadFilter(); f.type=type||"lowpass"; f.frequency.value=freq; if(q) f.Q.value=q;
    const g=ctx.createGain();
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    s.connect(f).connect(g).connect(ctx.destination); s.start(t0); s.stop(t0+dur+.05);
  }
  return {
    init,
    sizzle(l){ if(!ready||!sizzleGain) return; sizzleGain.gain.setTargetAtTime(save.muted?0:l*.075, ctx.currentTime,.25); },
    step(){ blip(160,.07,"sine",.13,110); },
    plop(){ blip(520,.16,"sine",.3,150); burst(.06,900,.12,0); },
    ding(){ blip(880,.5,"sine",.24); blip(1320,.5,"sine",.14,null,.05); },
    sparkle(){ [1046,1318,1568,2093].forEach((f,i)=>blip(f,.28,"triangle",.18,null,i*.075)); },
    cough(){ burst(.16,700,.3,0); burst(.22,520,.28,.22); blip(180,.2,"sawtooth",.1,90,.02); },
    whoosh(){ burst(.3,1800,.18,0,"highpass"); },
    tip(){ blip(300,.22,"sine",.2,700); burst(.18,1200,.12,.02); },
    chop(){ burst(.05,2600,.32,0,"bandpass",1.4); blip(220,.07,"square",.1,120); },
    crack(){ burst(.07,1500,.3,0,"bandpass",2); burst(.05,3000,.18,.05); },
    squeeze(){ blip(300,.5,"sine",.14,900); burst(.4,600,.08,0); },
    done(){ blip(660,.16,"triangle",.22); blip(990,.2,"triangle",.18,null,.09); },
    scrub(){ burst(.13,2200,.2,0,"bandpass",.9); },
    shine(){ [1568,2093,2637].forEach((f,i)=>blip(f,.22,"sine",.16,null,i*.06)); },
    munch(){ burst(.11,420,.26,0); burst(.11,360,.24,.15); burst(.1,400,.2,.3); },
    hello(){ blip(520,.14,"triangle",.18); blip(700,.16,"triangle",.15,null,.1); },
    bye(){ blip(700,.16,"triangle",.15); blip(520,.2,"triangle",.14,null,.1); }
  };
})();

const updateMuteUI = ()=>{ soundIco.textContent = save.muted?"🔇":"🔊"; soundChip.classList.toggle("off",save.muted); };
updateMuteUI();

/* ============================================================ PANTRY */

INGREDIENTS.forEach(ing=>{
  const el = document.createElement("div");
  el.className = "ingredient";
  el.dataset.id = ing.id;
  el.setAttribute("aria-label", ing.name);
  el.append(ing.emoji);
  const p = PREP[ing.id];
  if(p){
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = PREP_INFO[p.kind].badge;
    el.appendChild(b);
  }
  shelf.appendChild(el);
});

/* ============================================================
   THE CHEF — walks with ◀ ▶ / arrow keys, acts with the big button
   ============================================================ */

const SPOT_COUNT = 4;

function placeChef(animate){
  const st = stationEls[state.spot];
  if(!st) return;
  const r = st.getBoundingClientRect();
  const f = floorEl.getBoundingClientRect();
  if(!animate) chef.style.transition = "none";
  chef.style.left = (r.left + r.width/2 - f.left) + "px";
  if(!animate) requestAnimationFrame(()=>{ chef.style.transition = ""; });
  stationEls.forEach((s,i)=>s.classList.toggle("here", i === state.spot));
}

function moveChef(dir){
  const next = Math.max(0, Math.min(SPOT_COUNT-1, state.spot + dir));
  if(next === state.spot){ bounce(chef); return; }
  state.spot = next;
  chef.classList.toggle("flip", dir < 0);
  chef.classList.add("walk");
  clearTimeout(moveChef._t);
  moveChef._t = setTimeout(()=>chef.classList.remove("walk"), 320);
  Sound.step();
  placeChef(true);
  updateDoIt();
}

function renderHands(){
  hands.textContent = "";
  hands.classList.toggle("show", state.holding.length > 0);
  state.holding.forEach(id=>{
    const it = document.createElement("span");
    it.className = "hitem";
    if(isPile(id)){
      it.classList.add("pile");
      for(let i=0;i<3;i++){ const s=document.createElement("span"); s.textContent=byId[baseOf(id)].emoji; it.appendChild(s); }
    }else it.textContent = emojiOf(id);
    hands.appendChild(it);
  });
}

/* what will the big button do right now? */
function actionNow(){
  if(state.busy || state.eating) return { key:"wait", label:"WAIT..." };
  const todo = state.board.filter(b=>!b.done);
  switch(state.spot){
    case 0:
      if(state.holding.length && state.board.length < MAX_BOARD)
                                   return { key:"drop-board", label:"PUT IT DOWN" };
      if(todo.length){
        const handy = todo.find(b=>b.kind !== "squeeze");
        return handy ? { key:"prep", label:PREP_INFO[handy.kind].btn }
                     : { key:"hold", label:"HOLD IT!" };
      }
      if(state.board.length)       return { key:"take-board", label:state.board.length>1 ? "TAKE THEM ALL" : "PICK IT UP" };
      return { key:"none", label:"PICK FOOD" };
    case 1:
      if(state.dirty)              return { key:"scrub",      label:"WASH IT!" };
      if(state.holding.length)     return { key:"drop-pan",   label:"PUT IN PAN" };
      if(state.pan.length)         return { key:"tip",        label:"TIP IT OUT" };
      return { key:"none", label:"PICK FOOD" };
    case 2:
      if(state.holding.length)     return { key:"drop-plate", label:"PUT ON PLATE" };
      if(state.plate.length && !state.decorated)
                                   return { key:"decorate",   label:"MAKE IT NICE" };
      if(state.plate.length)       return { key:"none",       label:"IT LOOKS GREAT" };
      return { key:"none", label:"PICK FOOD" };
    case 3:
      if(state.holding.length)     return { key:"drop-plate", label:"PUT ON PLATE" };
      if(state.plate.length)       return { key:"serve",      label:"SERVE IT!" };
      return { key:"none", label:"MAKE FOOD" };
  }
  return { key:"none", label:"PICK FOOD" };
}

function updateDoIt(){
  const a = actionNow();
  doIt.textContent = a.label;
  doIt.classList.toggle("idle", a.key === "none" || a.key === "wait");
  doIt.classList.toggle("serve", a.key === "serve");
}

function doAction(){
  const a = actionNow();
  switch(a.key){
    case "drop-board": unloadHands(putOnBoard); break;
    case "prep":       stepPrep(); break;
    case "take-board": takeFromBoard(); break;
    case "scrub":      doScrub(); break;
    case "drop-pan":   unloadHands(sendToPan); break;
    case "tip":        tipPan(); break;
    case "drop-plate": unloadHands(addToPlate); break;
    case "decorate":   decorate(); break;
    case "serve":      serve(); break;
    case "hold":       break;   // squeezing happens while the button is held
    default:           bounce(chef); Sound.step(); break;
  }
  updateDoIt();
}

const handsRect = ()=> hands.classList.contains("show") ? hands.getBoundingClientRect() : chef.getBoundingClientRect();

function pickUp(id, fromRect){
  if(state.busy) return;
  if(state.holding.length >= MAX_HANDS){ bounce(chef); return; }
  flyTo(id, fromRect, chef.getBoundingClientRect(), ()=>{
    state.holding.push(id);
    renderHands(); Sound.plop(); bounce(chef); updateDoIt();
  });
}

/* empty his hands onto wherever he is standing, one after another */
function unloadHands(where){
  const r = handsRect();
  const carried = state.holding.splice(0);
  renderHands();
  carried.forEach((id,i)=> setTimeout(()=>where(id, r), reduced ? 0 : i*90));
  updateDoIt();
}

/* controls: buttons, and the keyboard for the ones who like arrow keys */
function hookHold(btn, onPress, onRelease){
  btn.addEventListener("pointerdown", e=>{ e.preventDefault(); Sound.init(); btn.classList.add("down"); onPress(); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev, ()=>{ btn.classList.remove("down"); onRelease && onRelease(); }));
}
hookHold(goLeft,  ()=>moveChef(-1));
hookHold(goRight, ()=>moveChef(1));
hookHold(doIt,    ()=>{ holdingBtn = true; doAction(); }, ()=>{ holdingBtn = false; });
let holdingBtn = false;

const keysDown = new Set();
window.addEventListener("keydown", e=>{
  if(bookModal.classList.contains("show")){
    if(e.key === "Escape" || e.key === " ") { closeBook(); e.preventDefault(); }
    return;
  }
  const k = e.key;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","Enter"].includes(k)) e.preventDefault();
  if(keysDown.has(k)) { if(k===" "||k==="ArrowUp"||k==="Enter") holdingBtn = true; return; }
  keysDown.add(k);
  Sound.init();
  if(k === "ArrowLeft")  moveChef(-1);
  if(k === "ArrowRight") moveChef(1);
  if(k === " " || k === "ArrowUp" || k === "Enter"){ holdingBtn = true; doIt.classList.add("down"); doAction(); }
});
window.addEventListener("keyup", e=>{
  keysDown.delete(e.key);
  if(e.key === " " || e.key === "ArrowUp" || e.key === "Enter"){ holdingBtn = false; doIt.classList.remove("down"); }
});

/* ============================================================ DRAG + TAP */

let drag = null;

shelf.addEventListener("pointerdown", e=>{
  const el = e.target.closest(".ingredient");
  if(!el || drag) return;
  Sound.init();
  drag = { id:el.dataset.id, el, startX:e.clientX, startY:e.clientY, fromRect:el.getBoundingClientRect(), moved:false, ghost:null };
  el.classList.add("pressed");
  e.preventDefault();
});

window.addEventListener("pointermove", e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY) > 10){
    drag.moved = true;
    drag.el.classList.remove("pressed");
    drag.el.classList.add("grabbed");
    const g = document.createElement("div");
    g.className = "ghost";
    g.textContent = byId[drag.id].emoji;
    document.body.appendChild(g);
    drag.ghost = g;
  }
  if(drag.ghost){
    drag.ghost.style.left = e.clientX+"px";
    drag.ghost.style.top  = e.clientY+"px";
    highlight(dropUnder(e.clientX,e.clientY));
  }
});

window.addEventListener("pointerup", e=>{
  if(!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove("pressed","grabbed");
  if(d.ghost){
    const zone = dropUnder(e.clientX,e.clientY);
    highlight(null);
    d.ghost.remove();
    const rect = { left:e.clientX-28, top:e.clientY-28, width:56, height:56 };
    if(zone === "board")      putOnBoard(d.id, rect);
    else if(zone === "pan")   sendToPan(d.id, rect);
    else if(zone === "plate" || zone === "seat") addToPlate(d.id, rect);
    else if(zone === "trash"){ Sound.whoosh(); bounce(trash); }
    else                      pickUp(d.id, rect);
  }else{
    pickUp(d.id, d.fromRect);   // a tap puts it in the chef's hands
  }
  updateDoIt();
});

window.addEventListener("pointercancel", ()=>{
  if(!drag) return;
  drag.el.classList.remove("pressed","grabbed");
  if(drag.ghost) drag.ghost.remove();
  highlight(null); drag = null;
});

function dropUnder(x,y){
  const el = document.elementFromPoint(x,y);
  const z = el && el.closest("[data-drop]");
  return z ? z.dataset.drop : null;
}
let litZone = null;
function highlight(zone){
  if(zone === litZone) return;
  [pan,plate,trash,board].forEach(el=>el.classList.remove("drop-ok"));
  if(zone === "pan") pan.classList.add("drop-ok");
  if(zone === "plate" || zone === "seat") plate.classList.add("drop-ok");
  if(zone === "trash") trash.classList.add("drop-ok");
  if(zone === "board") board.classList.add("drop-ok");
  litZone = zone;
}

/* ============================================================ 1. PREP */

function putOnBoard(id, fromRect){
  if(state.busy) return;
  if(state.board.length >= MAX_BOARD){ bounce(board); return; }
  const base = baseOf(id), p = PREP[base];
  flyTo(id, fromRect, board.getBoundingClientRect(), ()=>{
    state.board.push(p ? { id:base, kind:p.kind, need:p.need, progress:0, done:false }
                       : { id:base, kind:null,   need:0,      progress:0, done:true });
    Sound.plop(); bounce(board); renderBoard(); updateDoIt();
  });
}

function renderBoard(){
  boardContents.innerHTML = "";
  const items = state.board;
  squeezeRing.classList.remove("show");
  if(!items.length){
    boardWord.textContent = "PUT FOOD HERE";
    boardWord.classList.add("dim"); boardWord.classList.remove("go");
    return;
  }
  boardWord.classList.remove("dim");

  items.forEach(b=>{
    const el = document.createElement("div");
    el.className = "food";
    if(b.done && b.kind){
      paintFood(el, b.id + PREP_INFO[b.kind].suffix, 0);
    }else if(b.kind === "cut"){
      el.classList.add("pile");
      for(let i=0;i<b.progress+1;i++){
        const s = document.createElement("span");
        s.textContent = byId[b.id].emoji;
        s.style.fontSize = (1 - b.progress*.13) + "em";
        el.appendChild(s);
      }
    }else{
      el.textContent = byId[b.id].emoji;
      if(b.kind === "crack" && b.progress > 0) el.style.transform = "rotate(14deg)";
    }
    boardContents.appendChild(el);
  });

  const todo = items.filter(b=>!b.done);
  if(!todo.length){
    boardWord.textContent = items.length > 1 ? "TAKE THEM ALL" : "TAKE IT";
    boardWord.classList.add("go");
  }else{
    // whatever still needs doing decides the word
    const handy = todo.find(b=>b.kind !== "squeeze") || todo[0];
    boardWord.textContent = PREP_INFO[handy.kind].word;
    boardWord.classList.remove("go");
    const sq = todo.find(b=>b.kind === "squeeze");
    if(sq){ squeezeRing.classList.add("show"); squeezeRing.style.setProperty("--fill", sq.progress); }
  }
}

/* one press cuts / cracks EVERYTHING on the board by one step */
function stepPrep(){
  const todo = state.board.filter(b=>!b.done && b.kind && b.kind !== "squeeze");
  if(!todo.length) return;
  let chopped = false, cracked = false, anyFinished = false;
  todo.forEach(b=>{
    b.progress++;
    if(b.kind === "cut") chopped = true; else cracked = true;
    if(b.progress >= b.need){ b.progress = b.need; b.done = true; anyFinished = true; }
  });
  if(chopped){ Sound.chop(); slash(); }
  if(cracked){ Sound.crack(); bounce(board); }
  renderBoard();
  if(anyFinished){ Sound.done(); sparkleAt(board.getBoundingClientRect()); }
  updateDoIt();
}

function takeFromBoard(){
  if(!state.board.length || state.board.some(b=>!b.done)) return;
  const room = MAX_HANDS - state.holding.length;
  if(room <= 0){ bounce(chef); return; }
  const taken = state.board.splice(0, room);
  renderBoard();
  const from = board.getBoundingClientRect();
  taken.forEach((b,i)=>{
    const outId = b.kind ? b.id + PREP_INFO[b.kind].suffix : b.id;
    setTimeout(()=>{
      flyTo(outId, from, chef.getBoundingClientRect(), ()=>{
        state.holding.push(outId);
        renderHands(); Sound.plop(); bounce(chef); updateDoIt();
      });
    }, reduced ? 0 : i*90);
  });
}

function slash(){
  if(reduced) return;
  const s = document.createElement("div");
  s.className = "slash";
  s.style.left = (18 + Math.random()*64) + "%";
  board.appendChild(s);
  s.animate([
    { transform:"rotate(8deg) translateY(-30px)", opacity:0 },
    { transform:"rotate(8deg) translateY(0)",     opacity:1, offset:.4 },
    { transform:"rotate(8deg) translateY(30px)",  opacity:0 }
  ], { duration:210, easing:"ease-in" }).onfinish = ()=> s.remove();
}

/* board is still tappable directly, for the drag-and-drop way of playing */
board.addEventListener("click", ()=>{
  Sound.init();
  if(state.busy || !state.board.length) return;
  if(state.board.some(b=>!b.done)) stepPrep();
  else takeFromBoard();
});
let boardHold = false;
board.addEventListener("pointerdown", ()=>{ boardHold = true; });
["pointerup","pointercancel","pointerleave"].forEach(ev=>board.addEventListener(ev, ()=>{ boardHold = false; }));

/* ============================================================ 2. COOK */

function sendToPan(id, fromRect){
  if(state.busy) return;
  if(state.dirty){ nudgeSponge(); addToPlate(id, fromRect); return; }
  if(state.pan.length >= MAX_PAN){ addToPlate(id, fromRect); return; }
  flyTo(id, fromRect, pan.getBoundingClientRect(), ()=>{
    state.pan.push({ uid:++uid, id, ms:0 });
    state.panUsed = true;
    Sound.plop(); renderPan(); updateDoIt();
  });
}

function addToPlate(id, fromRect){
  if(state.busy) return;
  if(state.plate.length >= MAX_PLATE){ bounce(plate); return; }
  flyTo(id, fromRect, plate.getBoundingClientRect(), ()=>{
    state.plate.push({ uid:++uid, id, stage:0 });
    Sound.plop();
    plate.classList.remove("pop"); void plate.offsetWidth; plate.classList.add("pop");
    renderPlate(); updateDoIt();
  });
}

/* 3b. MAKE IT NICE — arrange the food neatly and add a garnish */
function decorate(){
  if(state.busy || !state.plate.length || state.decorated) return;
  state.decorated = true;
  plate.classList.add("nice");
  plate.classList.remove("pop"); void plate.offsetWidth; plate.classList.add("pop");
  Sound.shine(); Sound.sparkle();
  sparkleAt(plate.getBoundingClientRect());
  renderPlate(); updateDoIt();
}
plate.addEventListener("click", ()=>{ Sound.init(); decorate(); });

pan.addEventListener("click", ()=>{
  Sound.init();
  if(state.busy) return;
  if(state.dirty){ doScrub(); return; }
  if(state.pan.length === 0){ bounce(pan); return; }
  tipPan();
});

function doScrub(){
  if(!state.dirty) return;
  state.scrubs++;
  Sound.scrub(); suds();
  if(state.scrubs >= SCRUBS){
    state.dirty = false; state.scrubs = 0;
    grime.classList.remove("show"); sponge.classList.remove("show");
    Sound.shine(); sparkleAt(pan.getBoundingClientRect()); bounce(pan);
  }else{
    grime.style.opacity = String(1 - state.scrubs/SCRUBS);
  }
  updatePanWord(); updateSteps(); updateDoIt();
}
function nudgeSponge(){ sponge.classList.remove("show"); void sponge.offsetWidth; sponge.classList.add("show"); bounce(pan); }
function dirtyThePan(){
  state.dirty = true; state.scrubs = 0; state.panUsed = false;
  grime.style.opacity = "1";
  grime.classList.add("show"); sponge.classList.add("show");
  updatePanWord(); updateSteps(); updateDoIt();
}

function tipPan(){
  const room = MAX_PLATE - state.plate.length;
  if(room <= 0){ bounce(plate); return; }
  pan.classList.remove("tip"); void pan.offsetWidth; pan.classList.add("tip");
  Sound.tip();
  const moving = state.pan.splice(0, room);
  const panRect = pan.getBoundingClientRect(), plateRect = plate.getBoundingClientRect();
  renderPan();
  moving.forEach((it,i)=>{
    setTimeout(()=>{
      flyTo(it.id, panRect, plateRect, ()=>{
        state.plate.push({ uid:it.uid, id:it.id, stage:stageOf(it.ms) });
        Sound.plop();
        plate.classList.remove("pop"); void plate.offsetWidth; plate.classList.add("pop");
        renderPlate(); updateDoIt();
      }, stageOf(it.ms));
    }, reduced ? 0 : i*110);
  });
}

const stageOf = ms => Math.min(4, Math.floor(ms / STATE_MS));
const STATE_WORDS = ["RAW","HOT!","COOKED","GOLDEN","BURNT!"];
const STAGE_FILTER = [
  "drop-shadow(3px 5px 3px rgba(74,44,24,.5))",
  "saturate(1.25) drop-shadow(3px 5px 3px rgba(74,44,24,.5))",
  "sepia(.3) saturate(1.45) drop-shadow(3px 5px 3px rgba(74,44,24,.5))",
  "sepia(.6) saturate(1.7) brightness(.92) drop-shadow(0 0 8px rgba(255,190,60,.8))",
  "grayscale(1) brightness(.22) contrast(1.5) drop-shadow(3px 5px 3px rgba(74,44,24,.5))"
];

/* ============================================================ RENDERING */

const SPOTS = [ [0,-5], [-24,11], [24,8] ];
const PLATE_SPOTS = [ [0,-3], [-32,8], [32,6], [-18,-17], [19,-16] ];

function paintFood(el, id, stage){
  el.textContent = ""; el.classList.remove("pile");
  if(stage === 4){ el.textContent = "⬛"; return; }
  if(isPile(id)){
    el.classList.add("pile");
    for(let i=0;i<3;i++){ const s=document.createElement("span"); s.textContent=byId[baseOf(id)].emoji; el.appendChild(s); }
  }else el.textContent = emojiOf(id);
}

function renderPan(){
  panContents.innerHTML = "";
  state.pan.forEach((it,i)=>{
    const el = document.createElement("div"), s = stageOf(it.ms);
    el.className = "food s"+s; el.dataset.stage = String(s);
    paintFood(el, it.id, s);
    const [ox,oy] = SPOTS[i % SPOTS.length];
    el.style.setProperty("--ox",ox+"px"); el.style.setProperty("--oy",oy+"px");
    el.style.setProperty("--rot",((i*17)%25-12)+"deg");
    el.style.animationDelay = (i*.2)+"s";
    panContents.appendChild(el);
  });
  updatePanWord(); updateSteps();
}

function renderPlate(){
  plateContents.innerHTML = "";
  const n = state.plate.length;
  state.plate.forEach((it,i)=>{
    const el = document.createElement("div");
    el.className = "food s"+it.stage;
    paintFood(el, it.id, it.stage);
    let ox, oy, rot;
    if(state.decorated){
      // arranged in a neat ring instead of dumped in a heap
      const a = -Math.PI/2 + (i/Math.max(n,1))*Math.PI*2;
      ox = n === 1 ? 0 : Math.cos(a)*30;
      oy = n === 1 ? 4 : Math.sin(a)*17 + 4;
      rot = 0;
    }else{
      const p = PLATE_SPOTS[i % PLATE_SPOTS.length];
      ox = p[0]; oy = p[1]; rot = (i*23)%25 - 12;
    }
    el.style.setProperty("--ox",ox+"px"); el.style.setProperty("--oy",oy+"px");
    el.style.setProperty("--rot",rot+"deg");
    el.style.animationDelay = (i*.15)+"s";
    plateContents.appendChild(el);
  });
  if(state.decorated && n){
    const g = document.createElement("div");
    g.className = "food garnish";
    g.textContent = "🌿";
    g.style.setProperty("--ox","0px");
    g.style.setProperty("--oy","-26px");
    g.style.setProperty("--rot","-12deg");
    plateContents.appendChild(g);
  }
  const empty = n === 0;
  if(empty){ state.decorated = false; plate.classList.remove("nice"); }
  plateHint.style.opacity = empty ? "1" : "0";
  plateWord.textContent = empty ? "PLATE" : (state.decorated ? "PRETTY!" : "READY!");
  plateWord.classList.toggle("dim", empty);
  plateWord.classList.toggle("go", !empty);
  updateSteps();
}

function updatePanWord(){
  if(state.dirty){
    panWordText.textContent = "WASH IT!";
    panWord.classList.remove("dim"); panWord.classList.add("go");
    heatBars.forEach(b=>{ b.classList.remove("on","max"); b.style.height="30%"; });
    return;
  }
  panWord.classList.remove("go");
  if(state.pan.length === 0){
    panWordText.textContent = "EMPTY";
    panWord.classList.add("dim");
    heatBars.forEach(b=>{ b.classList.remove("on","max"); b.style.height="30%"; });
    return;
  }
  panWord.classList.remove("dim");
  const top = Math.max(...state.pan.map(it=>stageOf(it.ms)));
  panWordText.textContent = STATE_WORDS[top];
  heatBars.forEach((b,i)=>{
    const lit = i <= top;
    b.classList.toggle("on", lit && top < 4);
    b.classList.toggle("max", lit && top === 4);
    b.style.height = (30 + i*17) + "%";
  });
}

function refreshPanStages(){
  const nodes = panContents.children;
  for(let i=0;i<state.pan.length;i++){
    const it = state.pan[i], el = nodes[i];
    if(!el) continue;
    const s = stageOf(it.ms);
    if(el.dataset.stage !== String(s)){
      el.dataset.stage = String(s);
      el.className = "food s"+s;
      paintFood(el, it.id, s);
    }
  }
}

function updateSteps(){
  let now = "prep";
  if(state.dirty)             now = "clean";
  else if(state.plate.length) now = "serve";
  else if(state.pan.length)   now = "cook";
  // when the pan is dirty, station 2 stops saying COOK and asks to be cleaned
  panTagText.textContent = state.dirty ? "CLEAN" : "COOK";
  stepEls.forEach(el=>{
    const s = el.dataset.step;
    el.classList.toggle("now", s === now || (now === "clean" && s === "cook"));
  });
}

/* ============================================================ MAIN LOOP */

let last = performance.now(), steamAcc = 0;

function loop(now){
  const dt = Math.min(120, now - last);
  last = now;

  if(!state.paused){
    let hottest = -1;
    state.pan.forEach(it=>{ it.ms += dt; hottest = Math.max(hottest, stageOf(it.ms)); });
    if(state.pan.length){ refreshPanStages(); updatePanWord(); }

    const cooking = state.pan.length > 0 && !state.dirty;
    pan.classList.toggle("hot", cooking && !reduced);
    Sound.sizzle(cooking ? Math.min(1,.45+hottest*.18) : 0);

    if(cooking && !reduced){
      steamAcc += dt;
      const every = hottest >= 3 ? 130 : 260;
      while(steamAcc > every){ steamAcc -= every; puffSteam(hottest >= 4); }
    }else steamAcc = 0;

    // hold to squeeze — either the big button, the space bar, or the board itself
    const sq = state.board.find(b=>!b.done && b.kind === "squeeze");
    if(sq && (boardHold || (holdingBtn && state.spot === 0))){
      sq.progress = Math.min(1, sq.progress + dt/1300);
      squeezeRing.style.setProperty("--fill", sq.progress);
      if(sq.progress >= 1){
        sq.done = true;
        Sound.squeeze(); Sound.done();
        sparkleAt(board.getBoundingClientRect());
        renderBoard(); updateDoIt();
      }
    }
  }else Sound.sizzle(0);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function puffSteam(dark){
  const r = pan.getBoundingClientRect(), el = document.createElement("div");
  el.className = "steam";
  const size = 9+Math.random()*20;
  el.style.width = el.style.height = size+"px";
  el.style.left = (r.left + r.width*(.28+Math.random()*.44))+"px";
  el.style.top  = (r.top + r.height*.34)+"px";
  if(dark) el.style.background = "rgba(60,50,45,.6)";
  document.body.appendChild(el);
  const drift = (Math.random()*2-1)*55;
  el.animate([
    { transform:"translate(0,0) scale(.5)", opacity:0 },
    { transform:`translate(${drift*.4}px,-36px) scale(1)`, opacity:.7, offset:.35 },
    { transform:`translate(${drift}px,-${95+Math.random()*55}px) scale(1.9)`, opacity:0 }
  ], { duration:1400+Math.random()*700, easing:"ease-out" }).onfinish = ()=> el.remove();
}

function suds(){
  if(reduced) return;
  const r = pan.getBoundingClientRect();
  for(let i=0;i<7;i++){
    const el = document.createElement("div");
    el.className = "sud";
    const size = 6+Math.random()*13;
    el.style.width = el.style.height = size+"px";
    el.style.left = (r.left + r.width*(.2+Math.random()*.6))+"px";
    el.style.top  = (r.top  + r.height*(.3+Math.random()*.4))+"px";
    document.body.appendChild(el);
    const dx = (Math.random()*2-1)*80, dy = -28-Math.random()*80;
    el.animate([
      { transform:"translate(0,0) scale(.4)", opacity:.95 },
      { transform:`translate(${dx}px,${dy}px) scale(1.4)`, opacity:0 }
    ], { duration:600+Math.random()*400, easing:"ease-out" }).onfinish = ()=> el.remove();
  }
}

function sparkleAt(rect){
  if(reduced) return;
  for(let i=0;i<10;i++){
    const el = document.createElement("div");
    el.className = "flyer"; el.textContent = "✨";
    el.style.left = (rect.left+rect.width*(.2+Math.random()*.6))+"px";
    el.style.top  = (rect.top +rect.height*(.2+Math.random()*.6))+"px";
    el.style.fontSize = (11+Math.random()*15)+"px";
    document.body.appendChild(el);
    el.animate([
      { transform:"translate(-50%,-50%) scale(0)", opacity:1 },
      { transform:`translate(-50%,-50%) translate(${(Math.random()*2-1)*60}px,${-26-Math.random()*55}px) scale(1.3)`, opacity:0 }
    ], { duration:600+Math.random()*300, easing:"ease-out" }).onfinish = ()=> el.remove();
  }
}

/* ============================================================ FLYERS */

function flyTo(id, fromRect, toRect, doneCb, stage){
  if(reduced){ doneCb && doneCb(); return; }
  const el = document.createElement("div");
  el.className = "flyer";
  if(stage === 4) el.textContent = "⬛";
  else if(isPile(id)){
    el.classList.add("pile");
    for(let i=0;i<3;i++){ const s=document.createElement("span"); s.textContent=byId[baseOf(id)].emoji; el.appendChild(s); }
  }else el.textContent = emojiOf(id);
  if(stage) el.style.filter = STAGE_FILTER[stage];
  document.body.appendChild(el);
  const x0 = fromRect.left+fromRect.width/2, y0 = fromRect.top+fromRect.height/2;
  const x1 = toRect.left+toRect.width/2,     y1 = toRect.top+toRect.height/2;
  el.style.left = x0+"px"; el.style.top = y0+"px";
  const dx = x1-x0, dy = y1-y0;
  el.animate([
    { transform:"translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1)" },
    { transform:`translate(-50%,-50%) translate(${dx*.5}px,${dy*.5-95}px) rotate(190deg) scale(1.3)`, offset:.55 },
    { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) rotate(370deg) scale(.75)` }
  ], { duration:400, easing:"cubic-bezier(.38,.05,.5,1)" }).onfinish = ()=>{ el.remove(); doneCb && doneCb(); };
}

function bounce(el){
  if(reduced) return;
  el.animate([{transform:"scale(1)"},{transform:"scale(1.16,.86)"},{transform:"scale(.92,1.1)"},{transform:"scale(1)"}],
             {duration:340, easing:"ease-out"});
}

/* ============================================================ 3. SERVE */

function sillyName(names){
  const t = pick(SILLY_TEMPLATES);
  const A = names[0] || "Yum", B = names[1] || names[0] || "Stuff";
  return t.replace("{A}",A).replace("{B}",B);
}

function serve(){
  if(state.busy || !state.plate.length) return;
  state.busy = true;

  const items  = state.plate.slice();
  const ids    = [...new Set(items.map(i=>i.id))].sort();
  const key    = ids.join("+");
  const names  = ids.map(nameOf);
  const stages = items.map(i=>i.stage);
  const burnt  = stages.some(s=>s === 4);
  const allRaw = stages.every(s=>s === 0);

  const recipe = RECIPE_MAP[key];
  let dishName, dishEmoji;
  if(recipe){
    dishEmoji = burnt ? "⬛" : recipe.emoji;
    dishName  = burnt ? ("Extra Crispy "+recipe.name) : allRaw ? ("Fresh "+recipe.name) : recipe.name;
  }else{
    const saved = save.book[key];
    if(saved && saved.base){
      dishName  = burnt ? ("Extra Crispy "+saved.base) : saved.base;
      dishEmoji = burnt ? "⬛" : saved.emoji;
    }else{
      const base = sillyName(names);
      dishName  = burnt ? ("Extra Crispy "+base) : base;
      dishEmoji = burnt ? "⬛" : pick(MYSTERY_EMOJI);
    }
  }

  const wasKnown = !!save.book[key];
  if(!wasKnown){
    const base = recipe ? recipe.name : dishName.replace(/^Extra Crispy /,"").replace(/^Fresh /,"");
    save.book[key] = {
      base,
      emoji: recipe ? recipe.emoji : (dishEmoji === "⬛" ? MYSTERY_EMOJI[0] : dishEmoji),
      count: ids.length,
      own:   !recipe
    };
    persist(); renderBookChip();
  }

  showBanner(dishEmoji, dishName.toUpperCase(), !wasKnown, burnt);
  customerEats(ids, { burnt, allRaw, known:!!recipe, isNew:!wasKnown, nice:state.decorated });
}

function showBanner(emoji, name, isNew, burnt){
  bannerDish.textContent = emoji;
  bannerName.textContent = name;
  const shrink = name.length > 26 ? 4.0 : name.length > 18 ? 5.2 : 7;
  bannerName.style.fontSize = `clamp(22px, ${shrink}dvh, ${Math.round(shrink*12)}px)`;
  bannerNew.classList.toggle("show", isNew);
  banner.classList.add("show");
  if(burnt){ Sound.cough(); bannerName.style.background = "#7A5C46"; }
  else     { Sound.ding();  bannerName.style.background = "var(--tomato)"; }
  if(isNew) setTimeout(()=>Sound.sparkle(), 240);
  confetti(burnt);

  setTimeout(()=>{
    banner.classList.remove("show");
    state.plate = [];
    renderPlate();
    if(state.panUsed) dirtyThePan();     // 4. CLEAN
    state.busy = false;
    updateSteps(); updateDoIt();
  }, reduced ? 1000 : 2200);
}

function confetti(burnt){
  if(reduced) return;
  const colors = burnt ? ["#7A5C46","#4A2C18","#9c8878","#3A2110"]
                       : ["#E8412F","#5FB33F","#FFD766","#FFF6E3","#F5BE3C","#4A2C18"];
  const cx = window.innerWidth/2, cy = window.innerHeight*.5;
  for(let i=0;i<70;i++){
    const c = document.createElement("div");
    c.className = "conf";
    c.style.background = colors[i%colors.length];
    c.style.left = cx+"px"; c.style.top = cy+"px";
    fx.appendChild(c);
    const ang = Math.random()*Math.PI*2, dist = 150+Math.random()*400;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist*.75-85;
    c.animate([
      { transform:"translate(-50%,-50%) scale(0) rotate(0deg)", opacity:1 },
      { transform:`translate(${dx*.6-8}px,${dy*.6}px) scale(1.2) rotate(${180+Math.random()*360}deg)`, opacity:1, offset:.45 },
      { transform:`translate(${dx}px,${dy+300}px) scale(.9) rotate(${540+Math.random()*540}deg)`, opacity:0 }
    ], { duration:1500+Math.random()*900, easing:"cubic-bezier(.15,.6,.4,1)" }).onfinish = ()=> c.remove();
  }
}

/* ============================================================
   THE CUSTOMER — eats, says how it was, then a new one arrives
   ============================================================ */

function verdictFor(ids, how){
  if(how.burnt) return "crispy";
  if(how.allRaw) return "cold";
  if(how.known)  return "great";
  return "okay";
}

function say(text, starCount){
  bubble.textContent = text;
  bubble.classList.remove("show"); void bubble.offsetWidth; bubble.classList.add("show");
  if(starCount){
    stars.textContent = "⭐".repeat(starCount);
    stars.classList.remove("show"); void stars.offsetWidth; stars.classList.add("show");
  }else{
    stars.classList.remove("show");
    stars.textContent = "";
  }
}

let custTimers = [];
function clearCustTimers(){ custTimers.forEach(clearTimeout); custTimers = []; }

function customerEats(ids, how){
  clearCustTimers();
  state.eating = true;
  stars.classList.remove("show");
  bubble.classList.remove("show");

  customer.classList.remove("happy","arrive");
  customer.classList.add("chew");
  custTimers.push(setTimeout(()=>Sound.munch(), 400));

  custTimers.push(setTimeout(()=>{
    customer.classList.remove("chew");
    customer.classList.add("happy");
    const v = VERDICTS[verdictFor(ids, how)];
    const starCount = Math.min(3, v.stars + (how.nice ? 1 : 0));
    // a favourite ingredient can steal the line, but the stars stay honest
    const bases = ids.map(baseOf);
    let line = pick(v.lines);
    if(how.nice && Math.random() < .6)                        line = pick(PRETTY_LINES);
    else if(!how.nice && !how.burnt && Math.random() < .35)   line = pick(PRETTY_HINT);
    else for(const k of Object.keys(LIKES)){
      if(bases.includes(k) && Math.random() < .5){ line = pick(LIKES[k]); break; }
    }
    say(pick(v.faces) + " " + line, starCount);
  }, reduced ? 200 : 1200));

  custTimers.push(setTimeout(()=>{
    customer.classList.remove("happy");
    nextCustomer();
  }, reduced ? 900 : 3400));
}

function nextCustomer(){
  customer.classList.add("leave");
  Sound.bye();
  custTimers.push(setTimeout(()=>{
    let next = state.customer;
    while(next === state.customer) next = pick(CUSTOMERS);
    state.customer = next;
    customer.textContent = next;
    customer.classList.remove("leave");
    customer.classList.add("arrive");
    stars.classList.remove("show");
    Sound.hello();
    say(pick(HELLOS), 0);
    state.eating = false;
    updateDoIt();
    setTimeout(()=>customer.classList.remove("arrive"), 700);
  }, reduced ? 50 : 620));
}

customer.addEventListener("click", ()=>{
  Sound.init();
  if(state.busy || state.eating) return;
  say(pick(HELLOS), 0);
  bounce(customer);
  Sound.hello();
});

/* ============================================================ RECIPE BOOK */

const renderBookChip = ()=>{ bookCount.textContent = Object.keys(save.book).length; };

function openBook(){
  state.paused = true;
  Sound.sizzle(0);
  bookScore.textContent = RECIPES.filter(r=>save.book[keyOf(r.need)]).length + " OF " + TOTAL_RECIPES;

  bookGrid.innerHTML = "";
  RECIPES.forEach(r=>{
    const got = !!save.book[keyOf(r.need)];
    const c = document.createElement("div");
    c.className = "card" + (got ? "" : " locked");
    const e = document.createElement("div"); e.className = "cE";
    const n = document.createElement("div"); n.className = "cN";
    if(got){ e.textContent = r.emoji; n.textContent = r.name.toUpperCase(); }
    else   { e.textContent = "❓";    n.textContent = r.need.length + (r.need.length===1 ? " THING" : " THINGS"); }
    c.append(e,n); bookGrid.appendChild(c);
  });

  const mine = Object.keys(save.book).filter(k=>save.book[k].own);
  ownHead.style.display = mine.length ? "" : "none";
  ownGrid.innerHTML = "";
  mine.forEach(k=>{
    const d = save.book[k];
    const c = document.createElement("div"); c.className = "card mine";
    const e = document.createElement("div"); e.className = "cE"; e.textContent = d.emoji || "🥘";
    const n = document.createElement("div"); n.className = "cN"; n.textContent = (d.base||"").toUpperCase();
    c.append(e,n); ownGrid.appendChild(c);
  });

  bookModal.classList.add("show");
  Sound.sparkle();
}
function closeBook(){
  bookModal.classList.remove("show");
  state.paused = false;
  last = performance.now();
}
$("#bookChip").addEventListener("click", ()=>{ Sound.init(); openBook(); });
$("#bookClose").addEventListener("click", closeBook);
bookModal.addEventListener("click", e=>{ if(e.target === bookModal) closeBook(); });

/* ============================================================ BIN / SOUND / RESET */

trash.addEventListener("click", ()=>{
  Sound.init();
  if(state.busy) return;
  if(!state.plate.length && !state.pan.length && !state.board.length && !state.holding.length){ bounce(trash); return; }
  state.plate = []; state.pan = []; state.board = []; state.holding = []; state.decorated = false;
  renderPan(); renderPlate(); renderBoard(); renderHands();
  Sound.whoosh(); bounce(trash); updateDoIt();
});

soundChip.addEventListener("click", ()=>{
  Sound.init();
  save.muted = !save.muted;
  updateMuteUI(); persist();
  if(!save.muted) Sound.plop();
  bounce(soundChip);
});

let holdTimer = null;
title.addEventListener("pointerdown", ()=>{
  title.classList.add("resetting");
  holdTimer = setTimeout(()=>{
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    save = { book:{}, muted:false };
    renderBookChip(); updateMuteUI();
    state.pan = []; state.plate = []; state.board = []; state.holding = [];
    state.decorated = false; state.dirty = false; state.scrubs = 0; state.panUsed = false;
    grime.classList.remove("show"); sponge.classList.remove("show");
    renderPan(); renderPlate(); renderBoard(); renderHands();
    Sound.sparkle(); confetti(false);
    title.classList.remove("resetting");
    updateDoIt();
  }, 3000);
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  title.addEventListener(ev, ()=>{ clearTimeout(holdTimer); title.classList.remove("resetting"); });
});

document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("dblclick", e=>e.preventDefault());
document.addEventListener("contextmenu", e=>e.preventDefault());
window.addEventListener("resize", ()=>placeChef(false));

/* ---------- make it installable / work offline when hosted ----------
   (silently does nothing when the file is opened by double-click) */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ============================================================ GO */
customer.textContent = state.customer;
renderBoard(); renderPan(); renderPlate(); renderHands(); renderBookChip(); updateSteps(); updateDoIt();
requestAnimationFrame(()=>{ placeChef(false); setTimeout(()=>{ say(pick(HELLOS), 0); }, 600); });
</script>
